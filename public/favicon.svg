<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="sbGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="sbGlow" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="sbShadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#059669" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Emblem Container -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#sbGradient)" filter="url(#sbShadow)"/>
  <rect x="7" y="7" width="106" height="106" rx="27" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>

  <!-- Subtle Geometric Grid Lines -->
  <path d="M6 45 H114 M6 75 H114" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Stylized "S" + Digital Invoice Fold Monogram -->
  <!-- Upper Curve of S (Invoice Header with fold) -->
  <path d="M78 30 H45 C36.7 30 30 36.7 30 45 C30 53.3 36.7 60 45 60 H75 C83.3 60 90 66.7 90 75 C90 83.3 83.3 90 75 90 H40" 
        stroke="url(#paperGrad)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Lightning Bolt Speed Notch (5-Sec Fast Billing Accent) -->
  <path d="M67 22 L55 46 H71 L59 70" 
        stroke="#fef08a" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Tiny Indian Rupee (₹) / Thermal Slip Dots Accent -->
  <circle cx="42" cy="75" r="4.5" fill="#ffffff"/>
  <circle cx="56" cy="75" r="4.5" fill="rgba(255,255,255,0.85)"/>
  <circle cx="70" cy="75" r="4.5" fill="rgba(255,255,255,0.6)"/>
</svg>
