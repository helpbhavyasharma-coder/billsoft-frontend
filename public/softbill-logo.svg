<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="logoShadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#059669" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Icon Mark -->
  <g transform="translate(6, 6)">
    <rect width="68" height="68" rx="18" fill="url(#logoGrad)" filter="url(#logoShadow)"/>
    <rect x="1" y="1" width="66" height="66" rx="17" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
    <!-- S monogram -->
    <path d="M48 20 H30 C24 20 19 25 19 31 C19 37 24 42 30 42 H38 C44 42 49 47 49 53 C49 59 44 64 38 64 H20" 
          stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Fast Lightning / Rupee Slash -->
    <path d="M42 14 L34 32 H45 L37 50" 
          stroke="#fef08a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Typography -->
  <g transform="translate(90, 44)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5" fill="#0f172a" class="dark-text-white">
      Soft<tspan fill="#10b981">Bill</tspan>
    </text>
  </g>

  <!-- Subtitle / Tagline -->
  <g transform="translate(92, 62)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" letter-spacing="0.5" fill="#64748b">
      GST BILLING &amp; BUSINESS MANAGEMENT
    </text>
  </g>
</svg>
